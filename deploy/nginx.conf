# open.glsc.fr — fichiers statiques. Version HTTP seule : `certbot --nginx -d open.glsc.fr` y ajoute le HTTPS
# et la redirection tout seul (il modifie ce fichier : ne pas le réinstaller par-dessus).
server {
    listen 80;
    listen [::]:80;
    server_name open.glsc.fr;

    root /var/www/open.glsc.fr;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;

    location / { try_files $uri $uri/ =404; }
    location = /pics/releases.json { add_header Cache-Control "no-cache"; }
    location /pics/download/ { add_header Content-Disposition "attachment"; }
    location ~* \.(woff2|svg|png|mp4)$ { expires 30d; add_header Cache-Control "public"; }
}
