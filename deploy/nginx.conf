# open.glsc.fr — fichiers statiques. Certificat : certbot --nginx -d open.glsc.fr
server {
    listen 80;
    server_name open.glsc.fr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name open.glsc.fr;
    ssl_certificate     /etc/letsencrypt/live/open.glsc.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open.glsc.fr/privkey.pem;

    root /var/www/open.glsc.fr;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;

    location / { try_files $uri $uri/ =404; }
    location = /pics/releases.json { add_header Cache-Control "no-cache"; }
    location /pics/download/ { add_header Content-Disposition "attachment"; }
    location ~* \.(woff2|svg|png|mp4)$ { expires 30d; add_header Cache-Control "public"; }
}
