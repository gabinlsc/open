[workspace]
resolver = "3"
members = ["tools/showcase", "crates/core", "crates/ops", "crates/io", "crates/gpu", "crates/ai", "crates/app"]
# L'app Tauri exige WebView2 (Windows) : les autres crates se construisent et se testent partout.
default-members = ["tools/showcase", "crates/core", "crates/ops", "crates/io", "crates/gpu", "crates/ai"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/gabinlsc/openpics"
publish = false

[workspace.dependencies]
openpics-core = { path = "crates/core" }
openpics-ops = { path = "crates/ops" }
openpics-io = { path = "crates/io" }
openpics-gpu = { path = "crates/gpu" }
openpics-ai = { path = "crates/ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Pas de unwrap/expect/panic hors tests : les erreurs remontent en Result typé.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
