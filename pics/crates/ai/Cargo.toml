[package]
name = "openpics-ai"
description = "IA locale : catalogue de modèles vérifiés, et méthodes classiques sans modèle (sujet, retouche par diffusion)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openpics-core.workspace = true
openpics-ops.workspace = true
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[lints]
workspace = true

[features]
onnx = ["dep:ort"]

[dev-dependencies]
openpics-io.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
